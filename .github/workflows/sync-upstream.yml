name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BUNDLE_URL: https://nihav.org/nihav.gitbundle
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download upstream bundle
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/nihav.gitbundle" "$BUNDLE_URL"

      - name: Verify bundle and find upstream main
        id: bundle
        run: |
          git bundle verify "$RUNNER_TEMP/nihav.gitbundle" || true
          git bundle list-heads "$RUNNER_TEMP/nihav.gitbundle"
          heads=$(git bundle list-heads "$RUNNER_TEMP/nihav.gitbundle")
          ref=$(echo "$heads" | awk '$2=="refs/heads/main"{print $2}')
          [ -n "$ref" ] || ref=$(echo "$heads" | awk '$2=="refs/heads/master"{print $2}')
          [ -n "$ref" ] || ref=HEAD
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream commits and compare
        id: diff
        run: |
          git fetch "$RUNNER_TEMP/nihav.gitbundle" "${{ steps.bundle.outputs.ref }}:refs/upstream/main"
          up=$(git rev-parse refs/upstream/main)
          echo "Upstream: $up"
          echo "Fork main: $(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$up" HEAD; then
            echo "Fork already contains upstream, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch and open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin "refs/upstream/main:refs/heads/$SYNC_BRANCH"
          existing=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing is already open and has been updated."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "Sync with upstream ($(date -u +%F))" \
            --body "Automated sync from $BUNDLE_URL (upstream tip: \`$(git rev-parse --short refs/upstream/main)\`)."
