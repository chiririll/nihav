[package]
name = "nihav_misc"
version = "0.1.0"
authors = ["Kostya Shishkov <kostya.shishkov@gmail.com>"]
edition = "2018"

[dependencies.nihav_core]
path = "../nihav-core"

[dependencies.nihav_codec_support]
path = "../nihav-codec-support"

[dependencies.nihav_registry]
path = "../nihav-registry"

[dev-dependencies]
nihav_commonfmt = { path = "../nihav-commonfmt", default-features=false, features = ["all_demuxers"] }

[features]
default = ["all_decoders", "all_demuxers"]
decoders = []
demuxers = []

all_decoders = ["all_video_decoders", "all_audio_decoders"]

all_video_decoders = ["decoder_arbc", "decoder_fif", "decoder_moviepak", "decoder_mvi", "decoder_mwv1", "decoder_pgvv", "decoder_pivc", "decoder_qpeg", "decoder_tealvid", "decoder_ultimotion"]
decoder_arbc = ["decoders"]
decoder_fif = ["decoders"]
decoder_moviepak = ["decoders"]
decoder_mvi = ["decoders"]
decoder_mwv1 = ["decoders"]
decoder_pgvv = ["decoders"]
decoder_pivc = ["decoders"]
decoder_qpeg = ["decoders"]
decoder_tealvid = ["decoders"]
decoder_ultimotion = ["decoders"]

all_audio_decoders = []

all_demuxers = ["demuxer_av", "demuxer_mvi", "demuxer_qpeg", "demuxer_tealmov"]
demuxer_av = ["demuxers"]
demuxer_mvi = ["demuxers"]
demuxer_qpeg = ["demuxers"]
demuxer_tealmov = ["demuxers"]