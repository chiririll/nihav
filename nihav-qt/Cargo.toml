[package]
name = "nihav_qt"
version = "0.1.0"
authors = ["Kostya Shishkov <kostya.shishkov@gmail.com>"]
edition = "2018"

[dependencies.nihav_core]
path = "../nihav-core"
features = []

[dependencies.nihav_codec_support]
path = "../nihav-codec-support"
features = ["blockdsp", "fft", "qmf", "qt_pal"]

[dev-dependencies]
nihav_commonfmt = { path = "../nihav-commonfmt", default-features=false, features = ["all_demuxers", "muxer_mov", "decoder_pcm"] }

[features]
default = ["all_decoders", "all_demuxers", "all_encoders"]
all_decoders = ["all_video_decoders", "all_audio_decoders"]
decoders = []

all_video_decoders = ["decoder_rle", "decoder_smc", "decoder_rpza", "decoder_qdraw", "decoder_sivq", "decoder_svq1", "decoder_svq3", "decoder_rawvid", "decoder_cdvideo"]
decoder_rle = ["decoders"]
decoder_smc = ["decoders"]
decoder_rpza = ["decoders"]
decoder_qdraw = ["decoders"]
decoder_sivq = ["decoders"]
decoder_svq1 = ["decoders"]
decoder_svq3 = ["decoders"]
decoder_rawvid = ["decoders"]
decoder_cdvideo = ["decoders"]

all_audio_decoders = ["decoder_ima_adpcm_qt", "decoder_mace", "decoder_qcelp", "decoder_qdm", "decoder_qdm2", "decoder_alac"]
decoder_ima_adpcm_qt = ["decoders"]
decoder_mace = ["decoders"]
decoder_qcelp = ["decoders"]
decoder_qdm = ["decoders"]
decoder_qdm2 = ["decoders"]
decoder_alac = ["decoders"]

all_demuxers = ["demuxer_warhol"]
demuxers = []
demuxer_warhol = ["demuxers"]

all_encoders = ["all_video_encoders", "all_audio_encoders"]
encoders = []

all_video_encoders = ["encoder_rawvid", "encoder_rle", "encoder_rpza"]
encoder_rawvid = ["encoders"]
encoder_rle = ["encoders"]
encoder_rpza = ["encoders"]

all_audio_encoders = ["encoder_mace"]
encoder_mace = ["encoders"]
